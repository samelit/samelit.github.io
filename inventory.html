<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Инвентаризация</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/barcode-detector@3.2.2/dist/iife/polyfill.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
:root{--bg:#eef1f4;--card:#fff;--tx:#14202b;--mut:#64707d;--bd:#d5dbe1;--ok:#15803d;--okb:#dcfce7;--wr:#b45309;--wrb:#fef3c7;--bd2:#b91c1c;--bdb:#fee2e2;--in:#1d4ed8;--inb:#dbeafe;--ac:#0f3d5e;--act:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1419;--card:#17202a;--tx:#e6ebf0;--mut:#8b97a4;--bd:#2a3541;--ok:#4ade80;--okb:#12311f;--wr:#fbbf24;--wrb:#352a0d;--bd2:#f87171;--bdb:#3a1616;--in:#93c5fd;--inb:#14284a;--ac:#7cc0ea;--act:#0e1419;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1419;--card:#17202a;--tx:#e6ebf0;--mut:#8b97a4;--bd:#2a3541;--ok:#4ade80;--okb:#12311f;--wr:#fbbf24;--wrb:#352a0d;--bd2:#f87171;--bdb:#3a1616;--in:#93c5fd;--inb:#14284a;--ac:#7cc0ea;--act:#0e1419;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font-size:16px;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
select,input[type=text]{width:100%;font:inherit;padding:11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
button{font:inherit;font-weight:600;padding:11px 14px;border-radius:8px;border:1px solid var(--ac);background:var(--ac);color:var(--act)}
button.g{background:transparent;color:var(--ac)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--in);outline-offset:1px}
.row{display:flex;gap:8px}.row>*{flex:1}.row>.fit{flex:0 0 auto}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#banner{border-radius:10px;padding:14px;margin-bottom:12px;border:2px solid var(--bd);background:var(--card);min-height:84px}
#banner b{display:block;font-size:20px}
#banner.ok{background:var(--okb);border-color:var(--ok)}#banner.ok b{color:var(--ok)}
#banner.other{background:var(--wrb);border-color:var(--wr)}#banner.other b{color:var(--wr)}
#banner.unknown{background:var(--bdb);border-color:var(--bd2)}#banner.unknown b{color:var(--bd2)}
#banner.dup{background:var(--inb);border-color:var(--in)}#banner.dup b{color:var(--in)}
.chk{display:flex;gap:8px;align-items:center;margin:0 0 8px;font-size:14px;color:var(--tx)}
.chk[hidden]{display:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.stats button{padding:8px 4px;text-align:center;background:var(--card);color:var(--tx);border-color:var(--bd);font-weight:400;font-size:12px}
.stats button b{display:block;font-size:22px}
.stats button.on{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
.stats .s1 b{color:var(--ok)}.stats .s2 b{color:var(--bd2)}.stats .s3 b{color:var(--wr)}.stats .s4 b{color:var(--in)}
ul{list-style:none;margin:0;padding:0}
li[data-ix]{cursor:pointer}
li{padding:9px 0;border-bottom:1px solid var(--bd);display:flex;gap:8px;align-items:flex-start}
li:last-child{border:0}
li.t{position:relative;padding-bottom:22px}
.tm{position:absolute;right:0;bottom:4px;font-size:11px;color:var(--mut)}
li div{flex:1;min-width:0;overflow-wrap:anywhere}
li small{display:block;color:var(--mut)}
li button{padding:4px 10px}
.mut{color:var(--mut);font-size:14px}
#cam{display:none;position:fixed;inset:0;background:#000;z-index:9;flex-direction:column}
#cam .view{position:relative;flex:1;min-height:0;overflow:hidden}
#cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#frame{position:absolute;left:0;top:0;width:0;height:0;border-radius:14px;box-shadow:0 0 0 200vmax rgba(40,44,50,.6);overflow:hidden}
#frame i{position:absolute;width:26px;height:26px;border:4px solid #fff}
#frame i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-top-left-radius:14px}
#frame i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-top-right-radius:14px}
#frame i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-bottom-left-radius:14px}
#frame i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-bottom-right-radius:14px}
#frame u{position:absolute;left:6%;right:6%;top:50%;margin-top:-1px;height:2px;background:#ef4444;box-shadow:0 0 10px 2px rgba(239,68,68,.8)}
#hint{position:absolute;left:0;right:0;top:62%;text-align:center;color:#fff;font-size:14px;padding:0 16px;text-shadow:0 1px 3px #000}
#cam .bar{padding:12px;background:#000;color:#fff;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#cam .bar .btns{display:flex;gap:8px;flex:1 1 100%;justify-content:flex-end;align-items:center}
.hd{position:absolute;touch-action:none;z-index:2}
.hd[data-d=n]{left:30px;right:30px;top:0;height:30px;cursor:ns-resize}
.hd[data-d=s]{left:30px;right:30px;bottom:0;height:30px;cursor:ns-resize}
.hd[data-d=w]{top:30px;bottom:30px;left:0;width:30px;cursor:ew-resize}
.hd[data-d=e]{top:30px;bottom:30px;right:0;width:30px;cursor:ew-resize}
.hd[data-d=nw]{left:0;top:0;width:34px;height:34px;cursor:nwse-resize}
.hd[data-d=se]{right:0;bottom:0;width:34px;height:34px;cursor:nwse-resize}
.hd[data-d=ne]{right:0;top:0;width:34px;height:34px;cursor:nesw-resize}
.hd[data-d=sw]{left:0;bottom:0;width:34px;height:34px;cursor:nesw-resize}
.hd[data-d=n]::after,.hd[data-d=s]::after,.hd[data-d=w]::after,.hd[data-d=e]::after{content:"";position:absolute;border-radius:3px;background:rgba(255,255,255,.85)}
.hd[data-d=n]::after{left:50%;margin-left:-16px;top:7px;width:32px;height:5px}
.hd[data-d=s]::after{left:50%;margin-left:-16px;bottom:7px;width:32px;height:5px}
.hd[data-d=w]::after{top:50%;margin-top:-16px;left:7px;width:5px;height:32px}
.hd[data-d=e]::after{top:50%;margin-top:-16px;right:7px;width:5px;height:32px}
.ico{padding:8px 14px}
.bc{display:block;position:relative;width:30px;height:22px;border:2px solid currentColor;border-radius:5px;background:repeating-linear-gradient(90deg,currentColor 0 2px,transparent 2px 4px,currentColor 4px 5px,transparent 5px 8px) center/22px 12px no-repeat}
.bc::after{content:"";position:absolute;right:-9px;bottom:-9px;width:14px;height:14px;border-radius:50%;background:linear-gradient(#fff,#fff) center/8px 2px no-repeat,linear-gradient(#fff,#fff) center/2px 8px no-repeat,#16a34a}
#stk{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
#stk[hidden]{display:none}
.nav{position:absolute;top:50%;margin-top:-34px;width:44px;height:68px;padding:0;font-size:36px;line-height:1;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.55);color:#fff;border-radius:10px}
.nav.l{left:6px}.nav.r{right:6px}.nav:disabled{opacity:.25}
.sticker{background:#fff;color:#000;border-radius:14px;padding:14px 16px 12px;width:min(calc(100vw - 112px),440px);font-family:Arial,Helvetica,sans-serif}
.sn{font-weight:700;font-size:18px;line-height:1.25;margin-bottom:10px;overflow-wrap:anywhere}
.sb svg{display:block;width:100%;height:68px}
.si{text-align:center;font-weight:700;font-size:21px;margin-top:6px;letter-spacing:.5px}
.sinfo{color:#fff;font-size:13px;margin:12px 0;text-align:center;max-width:440px;overflow-wrap:anywhere}
#cam .bar span{flex:1;overflow-wrap:anywhere}
#cam .bar button.g{color:#fff;border-color:#fff}
</style>
</head>
<body>
<main>
<h1>Инвентаризация</h1>

<section class="card" id="setup">
  <label for="file">Файл из 1С (Excel или CSV)</label>
  <input id="file" type="file">
  <div id="map" hidden>
    <div class="three">
      <div><label for="cInv">Инв. номер</label><select id="cInv"></select></div>
      <div><label for="cName">Название</label><select id="cName"></select></div>
      <div><label for="cRoom">Кабинет</label><select id="cRoom"></select></div>
    </div>
  </div>
  <p class="mut" id="dbinfo">База не загружена.</p>
</section>

<section class="card">
  <label for="room">Кабинет, который сейчас инвентаризируем</label>
  <select id="room"></select>
  <label for="code">Инвентарный номер</label>
  <div class="row">
    <input id="code" type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" autocomplete="off" placeholder="Сканер или ввод вручную">
    <button class="fit" id="add">Проверить</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button class="g" id="camBtn">Камера</button>
    <button class="g" id="export">Выгрузить в Excel</button>
  </div>
</section>

<div id="banner"><span class="mut">Отсканируйте первую позицию.</span></div>

<label class="chk"><input type="checkbox" id="allr"> Показывать все кабинеты</label>
<div class="stats" id="stats"></div>
<p class="mut" id="tot" style="margin:-4px 0 12px;font-size:12px" hidden></p>
<section class="card"><ul id="list"></ul></section>
<button class="g" id="reset" style="width:100%">Начать заново</button>
</main>

<div id="stk" hidden><button class="nav l" id="sprev" aria-label="Предыдущая позиция">‹</button><button class="nav r" id="snext" aria-label="Следующая позиция">›</button><div class="sticker"><div class="sn" id="sn"></div><div class="sb" id="sb"></div><div class="si" id="si"></div></div><div class="sinfo" id="sinfo"></div><button id="stkClose">Закрыть</button></div>

<div id="cam">
  <div class="view"><video id="vid" playsinline muted></video><div id="frame"><i></i><i></i><i></i><i></i><u></u><b class="hd" data-d="n"></b><b class="hd" data-d="s"></b><b class="hd" data-d="w"></b><b class="hd" data-d="e"></b><b class="hd" data-d="nw"></b><b class="hd" data-d="ne"></b><b class="hd" data-d="sw"></b><b class="hd" data-d="se"></b></div><div id="hint">Поместите штрихкод в рамку. Края рамки можно тянуть, двойное касание возвращает квадрат.</div></div>
  <div class="bar"><span id="camMsg">Наведите на штрихкод</span><div class="btns"><button id="imp" class="g ico" type="button" aria-label="Распознать штрихкод из изображения" title="Штрихкод из изображения"><i class="bc"></i></button><input id="impf" type="file" accept="image/*" hidden><button id="torch" class="g" hidden>Подсветка</button><button id="camClose">Закрыть</button></div></div>
</div>
